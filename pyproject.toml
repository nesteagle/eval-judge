[project]
name = "eval-judge"
version = "0.2.0"
description = "LLM-as-a-judge scoring for AI systems, via provider batch APIs"
readme = "README.md"
authors = [
    { name = "nesteagle", email = "104323706+nesteagle@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=2.44.0",
    "python-dotenv>=1.2.2",
]

license = "Apache-2.0"
license-files = ["LICENSE"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
